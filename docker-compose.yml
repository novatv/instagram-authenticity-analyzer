services:
  analyzer:
    build: .
    ports:
      - "3200:3200"
    environment:
      INSTAGRAM_PROVIDER: ${INSTAGRAM_PROVIDER:-mock}
      META_GRAPH_ACCESS_TOKEN: ${META_GRAPH_ACCESS_TOKEN:-}
      META_IG_BUSINESS_ACCOUNT_ID: ${META_IG_BUSINESS_ACCOUNT_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      MAX_DATASET_ROWS: ${MAX_DATASET_ROWS:-50000}
    restart: unless-stopped
